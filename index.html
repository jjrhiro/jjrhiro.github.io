document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

column; gap: 12px; margin-top: 8px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px;\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #ffffff; flex-shrink: 0;\"><\u002Fspan>QBRs, escalations &amp; roadmap planning<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px;\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #ffffff; flex-shrink: 0;\"><\u002Fspan>TAM Tips library<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px;\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #ffffff; flex-shrink: 0;\"><\u002Fspan>Direct line to your TAM<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; color: #cdd5f9;\">Five9 TAM · Jerome Reyes<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; align-items: center; justify-content: center; padding: 40px;\">\n      <div style=\"width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <div style=\"font-size: 26px; font-weight: 700; color: #111111;\">{{ formTitle }}<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #707070;\">{{ formSubtitle }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <sc-if value=\"{{ isRegister }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <label style=\"font-size: 13px; font-weight: 500; color: #444444;\">Full name<\u002Flabel>\n              <input id=\"reg-name\" placeholder=\"Your name\" value=\"{{ name }}\" onchange=\"{{ onName }}\" style=\"height: 40px; width: 100%; box-sizing: border-box; padding: 0 12px; font-family: Roboto, Calibri, Arial, Helvetica, sans-serif; font-size: 15px; color: #444444; border: 1px solid #cccccc; border-radius: 0.25rem; outline: none;\" style-focus=\"border-color: #2a4cf9; box-shadow: 0 0 0 2px #cdd5f9;\">\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <label style=\"font-size: 13px; font-weight: 500; color: #444444;\">Email address<\u002Flabel>\n            <input id=\"login-email\" type=\"email\" placeholder=\"you@company.com\" value=\"{{ email }}\" onchange=\"{{ onEmail }}\" onkeydown=\"{{ onKeyDown }}\" style=\"height: 40px; width: 100%; box-sizing: border-box; padding: 0 12px; font-family: Roboto, Calibri, Arial, Helvetica, sans-serif; font-size: 15px; color: #444444; border: 1px solid #cccccc; border-radius: 0.25rem; outline: none;\" style-focus=\"border-color: #2a4cf9; box-shadow: 0 0 0 2px #cdd5f9;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <label style=\"font-size: 13px; font-weight: 500; color: #444444;\">Password<\u002Flabel>\n            <input id=\"login-password\" type=\"password\" placeholder=\"••••••••\" value=\"{{ password }}\" onchange=\"{{ onPassword }}\" onkeydown=\"{{ onKeyDown }}\" style=\"height: 40px; width: 100%; box-sizing: border-box; padding: 0 12px; font-family: Roboto, Calibri, Arial, Helvetica, sans-serif; font-size: 15px; color: #444444; border: 1px solid #cccccc; border-radius: 0.25rem; outline: none;\" style-focus=\"border-color: #2a4cf9; box-shadow: 0 0 0 2px #cdd5f9;\">\n          <\u002Fdiv>\n          <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 13px; color: #c12837;\">{{ error }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button id=\"login-submit\" onclick=\"{{ onSubmit }}\" disabled=\"{{ busy }}\" style=\"height: 40px; width: 100%; background: #2a4cf9; color: #ffffff; border: none; border-radius: 0.25rem; font-family: Roboto, Calibri, Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #2241ca;\" style-active=\"background: #19359b;\">{{ submitLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; color: #707070; font-size: 13px;\">\n          <span style=\"flex: 1; height: 1px; background: #cccccc;\"><\u002Fspan>\n          or continue with\n          <span style=\"flex: 1; height: 1px; background: #cccccc;\"><\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n          <button id=\"sso-google\" onclick=\"{{ onGoogle }}\" style=\"height: 40px; width: 100%; background: #ffffff; color: #444444; border: 1px solid #cccccc; border-radius: 0.25rem; font-family: Roboto, Calibri, Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer;\" style-hover=\"border-color: #2a4cf9; color: #2a4cf9;\">Google<\u002Fbutton>\n          <button id=\"sso-microsoft\" onclick=\"{{ onMicrosoft }}\" style=\"height: 40px; width: 100%; background: #ffffff; color: #444444; border: 1px solid #cccccc; border-radius: 0.25rem; font-family: Roboto, Calibri, Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer;\" style-hover=\"border-color: #2a4cf9; color: #2a4cf9;\">Microsoft<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ demoMode }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 13px; line-height: 1.5; color: #707070; background: #f5f7ff; border: 1px solid #cdd5f9; border-radius: 0.25rem; padding: 10px 14px;\">Demo mode — any email works. To enable real sign-in, paste your Firebase config into <span style=\"font-weight: 700;\">firebase-config.js<\u002Fspan>.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"font-size: 14px; color: #444444; text-align: center;\">\n          {{ togglePrompt }}\n          <a href=\"#\" onclick=\"{{ onToggleMode }}\" style=\"color: #2a4cf9; font-weight: 500; text-decoration: none; margin-left: 4px;\">{{ toggleAction }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"font-family: Roboto, Calibri, Arial, Helvetica, sans-serif; color: #444444;\" data-screen-label=\"TAM Site\">\n\n    <header style=\"position: sticky; top: 0; z-index: 50; background: #ffffff; border-bottom: 1px solid #e5e7eb; box-shadow: 0 2px 4px #32324703, 0 2px 2px #32324705;\">\n      <div style=\"max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 32px;\">\n        <img src=\"21d00fc5-7d06-4c03-a1d7-846d1186ecba\" alt=\"Five9\" style=\"height: 26px;\">\n        <nav style=\"display: flex; gap: 24px; flex: 1;\">\n          <a href=\"#about\" style=\"font-size: 14px; font-weight: 500; color: #444444; text-decoration: none;\" style-hover=\"color: #2a4cf9;\">About<\u002Fa>\n          <a href=\"#services\" style=\"font-size: 14px; font-weight: 500; color: #444444; text-decoration: none;\" style-hover=\"color: #2a4cf9;\">TAM Services<\u002Fa>\n          <a href=\"#tips\" style=\"font-size: 14px; font-weight: 500; color: #444444; text-decoration: none;\" style-hover=\"color: #2a4cf9;\">TAM Tips<\u002Fa>\n          <a href=\"#resources\" style=\"font-size: 14px; font-weight: 500; color: #444444; text-decoration: none;\" style-hover=\"color: #2a4cf9;\">Resources<\u002Fa>\n          <a href=\"#contact\" style=\"font-size: 14px; font-weight: 500; color: #444444; text-decoration: none;\" style-hover=\"color: #2a4cf9;\">Contact<\u002Fa>\n        <\u002Fnav>\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <span style=\"font-size: 13px; color: #707070;\">{{ visitorLabel }}<\u002Fspan>\n          <button id=\"signout\" onclick=\"{{ onSignOut }}\" style=\"height: 32px; padding: 0 12px; background: transparent; color: # s<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 500; color: #19359b; background: #cdd5f9; border-radius: 1.75rem; padding: 5px 14px;\">AI &amp; Automation<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 500; color: #19359b; background: #cdd5f9; border-radius: 1.75rem; padding: 5px 14px;\">Process Optimization<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"services\">\n      <div style=\"max-width: 1100px; margin: 0 auto; padding: 72px 24px; display: flex; flex-direction: column; gap: 36px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-size: 30px; font-weight: 700; color: #111111;\">TAM Services<\u002Fdiv>\n          <div style=\"font-size: 16px; color: #707070; max-width: 640px;\">What I do for your account as your Technical Account Manager.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n          <sc-for list=\"{{ services }}\" as=\"svc\" hint-placeholder-count=\"6\">\n            <div style=\"border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 24px; display: flex; flex-direction: column; gap: 10px; background: #ffffff; box-shadow: 0 2px 4px #3232471a, 0 0 1px #3232470d;\" style-hover=\"box-shadow: 0 4px 8px #3232471f, 0 4px 4px #3232470a;\">\n              <div style=\"font-size: 17px; font-weight: 700; color: #111111;\">{{ svc.title }}<\u002Fdiv>\n              <div style=\"font-size: 14px; line-height: 1.6; color: #707070;\">{{ svc.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"tips\" style=\"background: #f5f7ff;\">\n      <div style=\"max-width: 1100px; margin: 0 auto; padding: 72px 24px; display: flex; flex-direction: column; gap: 36px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-size: 30px; font-weight: 700; color: #111111;\">TAM Tips<\u002Fdiv>\n          <div style=\"font-size: 16px; color: #707070;\">Practical, bite-size guidance I share with my accounts.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <sc-for list=\"{{ tips }}\" as=\"tip\" hint-placeholder-count=\"3\">\n            <div style=\"background: #ffffff; border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 20px 24px; display: flex; align-items: center; gap: 20px;\">\n              <div style=\"font-size: 13px; font-weight: 700; color: #2a4cf9; background: #cdd5f9; border-radius: 0.25rem; padding: 6px 10px; white-space: nowrap;\">{{ tip.num }}<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 4px; flex: 1;\">\n                <div style=\"font-size: 16px; font-weight: 700; color: #111111;\">{{ tip.title }}<\u002Fdiv>\n                <div style=\"font-size: 14px; color: #707070;\">{{ tip.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; color: #707070; white-space: nowrap;\">{{ tip.date }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size: 14px; color: #707070;\">Want a tip on a specific topic? <a href=\"#contact\" style=\"color: #2a4cf9; font-weight: 500; text-decoration: none;\">Ask me<\u002Fa> and I'll cover it in an upcoming edition.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"resources\">\n      <div style=\"max-width: 1100px; margin: 0 auto; padding: 72px 24px; display: flex; flex-direction: column; gap: 36px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-size: 30px; font-weight: 700; color: #111111;\">Five9 Resources<\u002Fdiv>\n          <div style=\"font-size: 16px; color: #707070;\">Links I share most often with customers.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n          <sc-for list=\"{{ resources }}\" as=\"res\" hint-placeholder-count=\"3\">\n            <a href=\"{{ res.url }}\" target=\"_blank\" rel=\"noopener\" style=\"border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 24px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; background: #ffffff;\" style-hover=\"border-color: #2a4cf9;\">\n              <div style=\"font-size: 16px; font-weight: 700; color: #2a4cf9;\">{{ res.title }} →<\u002Fdiv>\n              <div style=\"font-size: 14px; line-height: 1.6; color: #707070;\">{{ res.desc }}<\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"background: #2a4cf9; color: #ffffff;\">\n      <div style=\"max-width: 1100px; margin: 0 auto; padding: 72px 24px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start;\">\n        <div style=\"font-size: 30px; font-weight: 700;\">Get in touch<\u002Fdiv>\n        <div style=\"font-size: 16px; line-height: 1.6; color: #cdd5f9; max-width: 560px;\">Escalation, question, or just want to talk through an idea for your contact center — reach out directly.<\u002Fdiv>\n        <div style=\"display: flex; gap: 16px; flex-wrap: wrap;\">\n          <a href=\"{{ mailtoHref }}\" style=\"display: inline-flex; align-items: center; gap: 8px; background: #ffffff; color: #2a4cf9; font-size: 15px; font-weight: 700; padding: 12px 24px; border-radius: 0.25rem; text-decoration: none;\">✉ {{ contactEmailVal }}<\u002Fa>\n          <a href=\"{{ telHref }}\" style=\"display: inline-flex; align-items: center; gap: 8px; background: transparent; color: #ffffff; border: 1px solid #ffffff; font-size: 15px; font-weight: 700; padding: 12px 24px; border-radius: 0.25rem; text-decoration: none;\">☎ {{ contactPhoneVal }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"background: #111111; color: #cccccc;\">\n      <div style=\"max-width: 1100px; margin: 0 auto; padding: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n        <img src=\"72966a1f-fc5f-4992-ab56-bfc6ca2030b2\" alt=\"Five9\" style=\"height: 18px; opacity: 0.8;\">\n        <div style=\"font-size: 13px;\">Jerome Reyes · Senior Technical Account Manager<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;contactEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;jerome.reyes@five9.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;contactPhone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+1 (925) 336 3414&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;skipLogin&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    user: (() => { try { return JSON.parse(localStorage.getItem('jr_tam_user') || 'null'); } catch (e) { return null; } })(),\n    mode: 'signin',\n    name: '',\n    email: '',\n    password: '',\n    error: ''\n  };\n\n  componentDidMount() {\n    let tries = 0;\n    const check = () => {\n      const cfg = window.FIREBASE_CONFIG;\n      const hasCfg = !!(cfg && cfg.apiKey && cfg.apiKey.indexOf('PASTE') !== 0);\n      if (hasCfg && window.firebase && window.firebase.auth) {\n        try {\n          if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);\n          this.fbNS = window.firebase;\n          this.fbAuth = this.fbNS.auth();\n          this.realAuth = true;\n          this.setState({ user: null });\n          this.unsubAuth = this.fbAuth.onAuthStateChanged((u) => {\n            this.setState({\n              user: u ? { name: u.displayName || (u.email || '').split('@')[0], email: u.email || '', provider: 'firebase' } : null,\n              busy: false\n            });\n          });\n          this.forceUpdate();\n          return;\n        } catch (e) { /* fall through to demo mode */ }\n      }\n      if (tries++ < 40) setTimeout(check, 250);\n    };\n    check();\n  }\n\n  componentWillUnmount() {\n    if (this.unsubAuth) this.unsubAuth();\n  }\n\n  friendlyError(err) {\n    const code = (err && err.code) || '';\n    const map = {\n      'auth/invalid-credential': 'Incorrect email or password.',\n      'auth/wrong-password': 'Incorrect email or password.',\n      'auth/user-not-found': 'No account with that email. Try registering instead.',\n      'auth/email-already-in-use': 'That email is already registered. Try signing in.',\n      'auth/weak-password': 'Password must be at least 6 characters.',\n      'auth/invalid-email': 'Please enter a valid email address.',\n      'auth/popup-closed-by-user': 'Sign-in window was closed before finishing.',\n      'auth/popup-blocked': 'Your browser blocked the sign-in popup. Allow popups and try again.',\n      'auth/unauthorized-domain': 'This domain is not authorized in Firebase. Add it under Authentication → Settings → Authorized domains.'\n    };\n    return map[code] || (err && err.message) || 'Sign-in failed. Please try again.';\n  }\n\n  val(e) {\n    if (e && e.target && e.target.value !== undefined) return e.target.value;\n    if (e && e.value !== undefined) return e.value;\n    return typeof e === 'string' ? e : '';\n  }\n\n  signIn(user) {\n    try { localStorage.setItem('jr_tam_user', JSON.stringify(user)); } catch (e) {}\n    this.setState({ user: user, error: '', password: '' });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isRegister = s.mode === 'register';\n    const skipLogin = this.props.skipLogin ?? false;\n    const showApp = !!s.user || skipLogin;\n\n    const submit = () => {\n      if (!s.email || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.email)) {\n        this.setState({ error: 'Please enter a valid email address.' });\n        return;\n      }\n      if (!s.password) {\n        this.setState({ error: 'Please enter a password.' });\n        return;\n      }\n      if (isRegister && !s.name.trim()) {\n        this.setState({ error: 'Please enter your name.' });\n        return;\n      }\n      if (this.realAuth) {\n        this.setState({ busy: true, error: '' });\n        const auth = this.fbAuth;\n        const p = isRegister\n          ? auth.createUserWithEmailAndPassword(s.email, s.password).then((cred) => {\n              if (cred && cred.user && s.name.trim()) return cred.user.updateProfile({ displayName: s.name.trim() });\n            })\n          : auth.signInWithEmailAndPassword(s.email, s.password);\n        p.catch((err) => this.setState({ error: this.friendlyError(err), busy: false }));\n        return;\n      }\n      this.signIn({ name: isRegister ? s.name.trim() : s.email.split('@')[0], email: s.email, provider: 'email' });\n    };\n\n    const social = (provider) => () => {\n      if (this.realAuth) {\n        this.setState({ busy: true, error: '' });\n        const prov = provider === 'google'\n          ? new this.fbNS.auth.GoogleAuthProvider()\n          : new this.fbNS.auth.OAuthProvider('microsoft.com');\n        this.fbAuth.signInWithPopup(prov)\n          .catch((err) => this.setState({ error: this.friendlyError(err), busy: false }));\n        return;\n      }\n      this.signIn({ name: 'Guest', email: '', provider: provider });\n    };\n\n    return {\n      showLogin: !showApp,\n      showApp: showApp,\n      isRegister: isRegister,\n      formTitle: isRegister ? 'Create your account' : 'Welcome back',\n      formSubtitle: isRegister ? 'Register with any email to access the TAM site.' : 'Sign in to access the TAM site.',\n      submitLabel: s.busy ? 'Please wait…' : (isRegister ? 'Register' : 'Sign in'),\n      togglePrompt: isRegister ? 'Already have an account?' : \"New here?\",\n      toggleAction: isRegister ? 'Sign in' : 'Register',\n      name: s.name,\n      email: s.email,\n      password: s.password,\n      error: s.error,\n      onName: (e) => this.setState({ name: this.val(e) }),\n      onEmail: (e) => this.setState({ email: this.val(e) }),\n      onPassword: (e) => this.setState({ password: this.val(e) }),\n      onKeyDown: (e) => { if (e && e.key === 'Enter') submit(); },\n      onSubmit: submit,\n      onGoogle: social('google'),\n      onMicrosoft: social('microsoft'),\n      onLinkedIn: social('linkedin'),\n      onToggleMode: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ mode: isRegister ? 'signin' : 'register', error: '' }); },\n      onSignOut: () => {\n        if (this.realAuth) { this.fbAuth.signOut(); }\n        try { localStorage.removeItem('jr_tam_user'); } catch (e) {}\n        this.setState({ user: null, email: '', password: '', name: '', mode: 'signin' });\n      },\n      demoMode: !this.realAuth,\n      busy: !!s.busy,\n      visitorLabel: s.user ? ('Signed in as ' + (s.user.name || 'Guest')) : 'Preview',\n      contactEmailVal: this.props.contactEmail ?? 'jerome.reyes@five9.com',\n      contactPhoneVal: this.props.contactPhone ?? '+1 (925) 000-0000',\n      mailtoHref: 'mailto:' + (this.props.contactEmail ?? 'jerome.reyes@five9.com'),\n      telHref: 'tel:' + String(this.props.contactPhone ?? '+19250000000').replace(/[^+\\d]/g, ''),\n      services: [\n        { title: 'Quarterly Business Reviews', desc: 'Structured QBRs covering platform health, usage trends, ROI, and a forward-looking action plan for your account.' },\n        { title: 'Escalation Management', desc: 'A single point of contact when things go wrong — I own the escalation, coordinate Five9 teams, and keep you informed until resolution.' },\n        { title: 'Roadmap & Release Planning', des
